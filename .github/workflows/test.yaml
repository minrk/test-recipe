on:
  push:

jobs:
  test:
    runs-on: macos-latest
    strategy:
      matrix:
        task:
          - rattler-build
          - conda-build
    steps:
      - uses: actions/checkout@v4
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.3
      - run: |
          pixi run ${{ matrix.task }}
