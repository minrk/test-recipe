[project]
authors = ["Min RK <benjaminrk@gmail.com>"]
channels = ["conda-forge"]
name = "test-recipe"
platforms = ["osx-arm64"]
version = "0.1.0"

[feature.rattler-build.tasks]
rattler-build = "rattler-build build -v -r recipe -m recipe/conda_build_config.yaml"

[feature.rattler-build.dependencies]
rattler-build = ">=0.38.0,<0.39"

[feature.conda-build.tasks]
conda-build = "conda-build -c conda-forge recipe -m recipe/conda_build_config.yaml"

[feature.conda-build.dependencies]
conda-build = ">=25.1.2,<26"

[environments]
rattler-build = { features = ["rattler-build"] }
conda-build = { features = ["conda-build"] }
